name: Responsive HUD handoff
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - studio/hud-brief.json
      - studio/hud-evaluation.json
      - .github/workflows/hud-proof.yml
      - assets/airlock-receiver/receiver.png
      - src/client/FirstShiftCompass.luau
      - src/client/Hud.client.luau
  pull_request:
    paths:
      - studio/hud-brief.json
      - studio/hud-evaluation.json
      - .github/workflows/hud-proof.yml
      - assets/airlock-receiver/receiver.png
      - src/client/FirstShiftCompass.luau
      - src/client/Hud.client.luau
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: GlebAvershin/lantern-atlas/.github/actions/author-hud@527cf6fb244e985b6187e34dc9554581cbc65b77
